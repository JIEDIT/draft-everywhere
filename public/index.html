<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一稿多发 · Draft → Everywhere</title>
<link rel="icon" type="image/png" href="assets/images/draft-everywhere-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="lang-zh">
<div class="container">

  <div class="topbar">
    <div class="brand">
      <img class="brand-logo" src="assets/images/draft-everywhere-favicon.png" alt="Draft Everywhere">
      <h1 data-i18n="title">一稿<span class="accent-zh">多发</span></h1>
    </div>
    <button class="lang-toggle is-zh" id="langToggle">
      <span class="en-lbl">EN</span>
      <span class="pill"><span class="knob"></span></span>
      <span class="zh-lbl">中</span>
    </button>
  </div>
  <div class="intro-row">
    <p class="tagline" data-i18n="tagline">把 raw draft 一稿生成 X / Substack / Medium / LinkedIn / 小红书五个平台的版本,每个版本都可以原地修改。小红书自动转中文,其他平台自动转英文。</p>
    <div class="support-widget" id="supportWidget">
      <script type="text/javascript" src="https://storage.ko-fi.com/cdn/widget/Widget_2.js"></script>
      <script type="text/javascript">kofiwidget2.init('Support us & share feedback', '#000000', 'L4X425OSS2');kofiwidget2.draw();</script>
      <noscript><a href="https://ko-fi.com/jieliu" target="_blank" rel="noopener noreferrer">Support us &amp; share feedback</a></noscript>
    </div>
  </div>
  <section class="runtime-status" data-role="runtime-status" aria-live="polite"></section>

  <div class="workspace">
    <!-- left -->
    <div class="source">
      <div class="zone-label" data-i18n="srcLabel">RAW DRAFT</div>
      <div class="draft-actions">
        <button class="clear-draft" id="clearDraft" type="button" hidden>CLEAR</button>
      </div>
      <div class="draft-box">
        <textarea id="draft" data-i18n-ph="draftPh" placeholder="把你的 raw draft 贴在这里……"></textarea>
      </div>

        <label class="plat-toggle on"><input type="checkbox" value="substack" checked><span class="p-icon sub"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22.539 8.242H1.46V5.406h21.08v2.836zM1.46 10.812V24L12 18.11 22.54 24V10.812H1.46zM22.54 0H1.46v2.836h21.08V0z"/></svg></span>Substack</label>

        <label class="plat-toggle on"><input type="checkbox" value="linkedin" checked><span class="p-icon li"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg></span>LinkedIn</label>
      </div>
      <button id="go" data-i18n="go" disabled>生成各平台版本</button>
      <div class="err" id="err" style="display:none;"></div>
      <div class="loading" id="loading" style="display:none;" data-i18n="loadingGen">正在按平台规则重新排版……</div>
    </div>

    <!-- right -->
    <div class="output">
      <div class="zone-label" data-i18n="outLabel">PLATFORM VERSIONS</div>
      <div class="results-tabs" id="resultsTabs"></div>
      <div id="results"></div>
      <div class="empty-state" id="emptyState" style="display:none;">
        <div class="es-icon">✍︎</div>
        <p data-i18n="emptyHint">各平台版本会在你点击"生成"之后出现在这里。生成后点上方标签,即可在平台之间切换、逐个调整。</p>
      </div>
    </div>
  </div>

</div>

<dialog class="clear-dialog" id="clearDraftDialog">
  <div class="clear-dialog-content">
    <h2 data-i18n="clearTitle">清除这份草稿？</h2>
    <p data-i18n="clearBody">这会移除 Raw Draft 和所有已生成的平台版本。<br>平台选择和显示设置将保持不变。</p>
    <div class="clear-dialog-actions">
      <button class="dialog-cancel" id="cancelClearDraft" type="button" data-i18n="cancelClear">取消</button>
      <button class="dialog-confirm" id="confirmClearDraft" type="button" data-i18n="confirmClear">清除草稿</button>
    </div>
  </div>
</dialog>

<script src="shared/platform-constraints.js"></script>
<script src="shared/twitter-text-browser.js"></script>
<script src="shared/platform-counting.js"></script>
<script src="js/app.js"></script>
</body>
</html>
